x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  pda-frontend:
    build:
      context: ./prot-des-timeline/frontend/
    depends_on:
      - pda-backend
    restart: unless-stopped
    logging: *default-logging
  pda-backend:
    build:
      context: ./prot-des-timeline/backend/
    environment:
      - MODULE_NAME=backend.app
      - GUNICORN_WORKERS=2
    depends_on:
      - pda-mongo
    restart: unless-stopped
    logging: *default-logging
  pda-mongo:
    image: "mongo:7.0.9"
    restart: unless-stopped
    logging: *default-logging
